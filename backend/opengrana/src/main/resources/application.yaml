spring:
  application:
    name: opengrana
  profiles:
      active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
jwt:
  secret-key: ${JWT_SECRET_KEY}
  expiration-minutes: 60
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}